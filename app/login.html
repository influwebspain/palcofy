<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PALCOFY — Acceder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>

  <div class="login-page">
    <div class="login-box">
      <!-- Brand Header -->
      <div class="login-brand">
        <div class="logo-mark">
          <svg viewBox="0 0 24 24" fill="none">
            <rect x="3"    y="10" width="2" height="5"  rx="1" fill="currentColor"/>
            <rect x="7.5"  y="6"  width="2" height="13" rx="1" fill="currentColor"/>
            <rect x="12"   y="2"  width="2" height="20" rx="1" fill="#FF3D7F"/>
            <rect x="16.5" y="7"  width="2" height="11" rx="1" fill="currentColor"/>
          </svg>
        </div>
        <h1>PALCOFY</h1>
        <p>Portal Corporativo</p>
      </div>

      <div class="login-card">
        <!-- Tabs -->
        <div class="auth-tabs">
          <button class="auth-tab is-active" data-tab="login">Acceder</button>
          <button class="auth-tab" data-tab="register">Crear cuenta</button>
        </div>

        <!-- Error message -->
        <div class="auth-error" id="auth-error"></div>

        <!-- Demo mode indicator -->
        <div id="demo-banner" style="display:none;background:rgba(124,58,237,0.08);border:1px solid rgba(124,58,237,0.2);border-radius:8px;padding:8px 12px;margin-bottom:20px;font-size:12px;color:var(--app-accent);text-align:center;">
          Modo Local — Demo
        </div>

        <!-- ===== LOGIN FORM ===== -->
        <form id="login-form">
          <div class="app-field">
            <label for="login-email">Correo corporativo o usuario</label>
            <input type="email" id="login-email" placeholder="ejemplo@hotel.com" required />
          </div>
          <div class="app-field" style="position:relative;">
            <label for="login-password">Contraseña</label>
            <input type="password" id="login-password" placeholder="••••••••" required minlength="6" />
            <a href="#" id="forgot-password-link" style="position:absolute;right:0;top:0;font-size:12px;color:var(--app-accent);text-decoration:none;font-weight:600;">¿Olvidaste tu contraseña?</a>
          </div>

          <button type="submit" class="app-btn app-btn--primary" id="login-btn" style="width:100%;margin-bottom:12px;">
            Entrar al portal
          </button>
          <a href="../index.html" class="app-btn app-btn--ghost" style="text-decoration:none;text-align:center;width:100%;">
            Volver a la web
          </a>
        </form>

        <!-- ===== REGISTER CHOICE PANEL ===== -->
        <div id="register-form" style="display:none;">
          <p style="font-size:14px;color:var(--app-text-muted);margin-bottom:20px;text-align:center;">
            Selecciona tu perfil corporativo:
          </p>

          <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:20px;">
            <a href="register-artist.html" class="role-option" style="text-decoration:none;display:flex;align-items:center;gap:14px;padding:16px;border:1.5px solid var(--app-accent);background:rgba(124,58,237,0.04);border-radius:12px;transition:all 0.2s;">
              <div class="role-icon" style="font-size:24px;">🎵</div>
              <div>
                <div class="role-label" style="font-size:15px;font-weight:700;color:var(--app-dark);">Artista / Agrupación</div>
                <div class="role-desc" style="font-size:12px;color:var(--app-text-muted);">Gestión de actuaciones y cobros.</div>
              </div>
            </a>

            <a href="register-venue.html" class="role-option" style="text-decoration:none;display:flex;align-items:center;gap:14px;padding:16px;border:1.5px solid var(--app-border);background:var(--app-surface-2);border-radius:12px;transition:all 0.2s;">
              <div class="role-icon" style="font-size:24px;">🏨</div>
              <div>
                <div class="role-label" style="font-size:15px;font-weight:700;color:var(--app-dark);">Hotel / Recinto / B2B</div>
                <div class="role-desc" style="font-size:12px;color:var(--app-text-muted);">Búsqueda y contratación automatizada.</div>
              </div>
            </a>
          </div>

          <a href="../index.html" class="app-btn app-btn--ghost" style="text-decoration:none;text-align:center;width:100%;">
            Volver a la web
          </a>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    /* ---- Imports ---- */
    let authModule;
    try {
      authModule = await import('./auth.js');
    } catch (e) {
      console.error('Import error:', e);
      document.getElementById('auth-error').textContent = 'Error cargando módulos. Abre desde http://localhost:8080';
      document.getElementById('auth-error').classList.add('is-visible');
    }

    if (!authModule) throw new Error('No se pudo cargar auth.js');

    const { login, register, getUserProfile, onAuthChange, redirectByRole, resetPassword } = authModule;

    /* Importar config para saber el modo */
    const config = await import('./firebase-config.js');
    if (!config.isFirebaseConfigured) {
      document.getElementById('demo-banner').style.display = '';
    }

    /* Si ya hay sesión, redirigir */
    onAuthChange(async (user) => {
      if (user) {
        if (user.uid === 'admin_super_user' || (user.email && user.email.toLowerCase() === 'admin@palcofy.com')) {
          window.location.href = 'admin.html';
          return;
        }
        const profile = await getUserProfile(user.uid);
        if (profile) redirectByRole(profile.role);
      }
    });

    /* ---- DOM refs ---- */
    const tabs = document.querySelectorAll('.auth-tab');
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const errorEl = document.getElementById('auth-error');

    /* ---- Tabs ---- */
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('is-active'));
        tab.classList.add('is-active');
        errorEl.classList.remove('is-visible');
        if (tab.dataset.tab === 'login') {
          loginForm.style.display = '';
          registerForm.style.display = 'none';
        } else {
          loginForm.style.display = 'none';
          registerForm.style.display = '';
        }
      });
    });

    /* Auto-activar pestaña si viene con hash #register */
    if (window.location.hash.includes('register') || window.location.hash.includes('registro')) {
      const regTab = document.querySelector('.auth-tab[data-tab="register"]');
      if (regTab) regTab.click();
    }

    /* ---- Role selector ---- */
    const roleOptions = document.querySelectorAll('.role-option');
    const roleInput = document.getElementById('reg-role');
    roleOptions.forEach(opt => {
      opt.addEventListener('click', () => {
        roleOptions.forEach(o => o.classList.remove('is-selected'));
        opt.classList.add('is-selected');
        roleInput.value = opt.dataset.role;
      });
    });

    /* ---- Admin Fast Login ---- */
    const adminFastBtn = document.getElementById('admin-fast-login');
    if (adminFastBtn) {
      adminFastBtn.addEventListener('click', async () => {
        document.getElementById('login-email').value = 'admin@palcofy.com';
        document.getElementById('login-password').value = 'AdminPalcofy2026!';
        try {
          await login('admin@palcofy.com', 'AdminPalcofy2026!');
        } catch (e) {
          console.error('Admin fast login error:', e);
        }
        window.location.href = 'admin.html';
      });
    }

    /* ---- Forgot Password ---- */
    const forgotLink = document.getElementById('forgot-password-link');
    if (forgotLink) {
      forgotLink.addEventListener('click', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        if (!email) {
          errorEl.textContent = 'Por favor, introduce tu email arriba primero.';
          errorEl.style.color = '';
          errorEl.classList.add('is-visible');
          return;
        }
        forgotLink.textContent = 'Enviando...';
        forgotLink.style.pointerEvents = 'none';
        try {
          if (resetPassword) {
            await resetPassword(email);
            errorEl.textContent = 'Si el email existe, se han enviado las instrucciones de recuperación.';
            errorEl.style.color = '#10b981';
            errorEl.classList.add('is-visible');
          }
        } catch (err) {
          errorEl.textContent = 'Error al intentar recuperar la contraseña.';
          errorEl.style.color = '';
          errorEl.classList.add('is-visible');
        } finally {
          forgotLink.textContent = 'He olvidado mi contraseña';
          forgotLink.style.pointerEvents = '';
        }
      });
    }

    /* ---- Login ---- */
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const pass  = document.getElementById('login-password').value;
      const btn   = document.getElementById('login-btn');
      btn.disabled = true;
      btn.textContent = 'Entrando…';
      errorEl.classList.remove('is-visible');

      try {
        const user = await login(email, pass);
        if (email.toLowerCase() === 'admin@palcofy.com') {
          window.location.href = 'admin.html';
          return;
        }
        const profile = user ? await getUserProfile(user.uid) : null;
        if (profile && profile.role) {
          redirectByRole(profile.role);
        } else {
          window.location.href = 'dashboard-venue.html';
        }
      } catch (err) {
        console.error('Login error:', err);
        const msg = err.code === 'auth/user-not-found'
          ? 'No existe una cuenta con este email.'
          : err.code === 'auth/wrong-password'
          ? 'Contraseña incorrecta.'
          : 'Error al iniciar sesión. Inténtalo de nuevo.';
        errorEl.textContent = msg;
        errorEl.classList.add('is-visible');
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });

    /* ---- Register ---- */
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name  = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const pass  = document.getElementById('reg-password').value;
      const role  = roleInput.value;
      const btn   = document.getElementById('register-btn');
      btn.disabled = true;
      btn.textContent = 'Creando cuenta…';
      errorEl.classList.remove('is-visible');

      try {
        console.log('Registering:', { name, email, role });
        await register({ name, email, password: pass, role });
        console.log('Register OK, redirecting...');
        redirectByRole(role);
      } catch (err) {
        console.error('Register error:', err);
        const msg = err.code === 'auth/email-already-in-use'
          ? 'Ya existe una cuenta con este email.'
          : err.code === 'auth/weak-password'
          ? 'La contraseña debe tener al menos 6 caracteres.'
          : 'Error al crear la cuenta. Inténtalo de nuevo.';
        errorEl.textContent = msg;
        errorEl.classList.add('is-visible');
        btn.disabled = false;
        btn.textContent = 'Crear cuenta';
      }
    });
  </script>

</body>
</html>
